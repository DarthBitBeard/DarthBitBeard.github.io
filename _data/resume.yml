# The first project is shown as the featured card on the Classic skin.
projects:
  - eyebrow: "Home Lab"
    icon: "network"
    title: "Firewall, DNS, and Infrastructure Security"
    meta: "OPNsense | AdGuard | Hyper-V | Self-hosted, ongoing"
    bullets:
      - "Protect the whole house with OPNsense as the firewall, with redundant firewall and DNS setups."
      - "Use AdGuard for DNS blocking across the home network."
      - "Run a Hyper-V server hosting an Uptime Kuma monitor and a domain controller for local Active Directory testing."
      - "Host local services behind that protection, including a Jellyfin server for local media and a server with a 1080 Ti for local AI testing and tinkering."
      - "High Availability Networking: Designed and deployed a highly available OPNsense firewall cluster utilizing CARP for seamless failover, integrated with Tailscale VPN for secure remote access."
      - "Enterprise Virtualization &amp; DR: Administer a Microsoft Hyper-V environment hosting headless Linux servers and Docker containers, utilizing Veeam Backup &amp; Replication for comprehensive Disaster Recovery (DR) and automated backups."
  - eyebrow: "Live Defensive Honeypot"
    icon: "radar"
    title: "T-Pot Honeypot, Attack Telemetry"
    meta: "Oracle Cloud Always Free | T-Pot, Cowrie, Tanner | Oct 2026 - Present"
    bullets:
      - "Deployed a T-Pot honeypot on an isolated Oracle Cloud Always Free virtual machine, with only decoy services exposed to the internet."
      - "Collects real SSH, SQL, SIP, and HTTP attack telemetry through Cowrie, Dionaea, Sentrypeer, and Tanner, with an attack map showing source countries and service types."
      - "Logged 149,551 attacks in 24 hours as of October 30, 2026, up from 3,292 on October 28, 2026, with counts and trends shared only in sanitized form, no source IPs or payloads published."
  - eyebrow: "Offensive Security Practice"
    icon: "target"
    title: "Hack The Box Labs"
    meta: "May 2026 - Present"
    bullets:
      - "Practical training in vulnerability assessment, network enumeration, and privilege escalation using Kali Linux tooling."
      - "Bash and PowerShell scripting to automate reconnaissance and interact with target systems."
      - "Translating offensive security findings into defensive strategies for enterprise networks."
      - "BSides Tampa CTF (11th Place): Competed in the BSides Tampa Capture The Flag competition, demonstrating practical offensive security, enumeration, and exploitation skills under pressure to secure an 11th place overall team finish. The team pwned 19 of 24 flags, and Beard98 was named Team MVP."
  - eyebrow: "Open Source Security Tool"
    icon: "lantern"
    title: "Lantern, Home Network Scanner"
    meta: "Python, stdlib only | Open source, MIT | Oct 2026 - Present"
    bullets:
      - "Built from scratch a local-first scanner that finds devices on a private home network, flags risky open ports in plain English, and shows what changed since the last scan."
      - "Defensive only and local-first: private subnets only, no brute force or exploits, with results staying in a local SQLite file with scan history and diff."
      - "Command line first with a local web dashboard, named network scopes, and trusted-device labels stored by MAC address."
      - "Ready for use now, and still being updated."
    link_url: "https://github.com/DarthBitBeard/Lantern"
    link_label: "View Lantern on GitHub"

